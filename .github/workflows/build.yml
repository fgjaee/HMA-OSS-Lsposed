name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties dummy file
      run: |
        cat > local.properties << EOF
        officialBuild=false
        crowdinProjectId=
        crowdinApiKey=
        fileDir=
        storePassword=
        keyAlias=
        keyPassword=
        localBuild=false
        EOF

    - name: Fix hardcoded Git branch reference
      run: git update-ref refs/remotes/origin/master HEAD

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct signed APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s 'app/build/outputs/apk/debug/app-debug.apk'
          cp 'app/build/outputs/apk/debug/app-debug.apk' 'HMA-OSS.apk'
          tag=latest-apk
          printf 'Latest APK and module assets from build #%s (%s)\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > direct-release-notes.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" 'HMA-OSS.apk' --clobber
            gh release edit "$tag" --title 'Latest Android APK' --notes-file direct-release-notes.txt
          else
            gh release create "$tag" 'HMA-OSS.apk' --target "$GITHUB_SHA" --title 'Latest Android APK' --notes-file direct-release-notes.txt --prerelease
          fi
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/HMA-OSS.apk" >> "$GITHUB_STEP_SUMMARY"
